# Server-side secret scan — the portable equivalent of push protection; works on
# private repos with no GitHub Advanced Security. Runs the gitleaks binary directly
# over full history, which avoids gitleaks-action's initial-push diff-range bug (the
# root commit has no parent) and needs no license key. Make it a required check.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so every commit is scanned
      - name: Install gitleaks
        run: |
          VER=8.30.1
          mkdir -p "$RUNNER_TEMP/gitleaks"
          ARCHIVE="$RUNNER_TEMP/gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$ARCHIVE"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan
        run: gitleaks detect --source . --redact --no-banner
