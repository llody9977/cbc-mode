# Deploy the static site in docs/ via GitHub Actions (Pages source = "GitHub
# Actions"), NOT "deploy from a branch". The branch source runs a GitHub-injected
# workflow that uses actions/upload-artifact@v4 (Node 20); authoring the deploy
# ourselves lets us pin the current Node 24 Pages actions.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
