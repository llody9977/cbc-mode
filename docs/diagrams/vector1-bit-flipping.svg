<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>:root{--card:#ffffff;--panel:#f8fafc;--border:#e2e8f0;--ink:#0f172a;--muted:#475569;--neuf:#f1f5f9;--neus:#cbd5e1;--arw:#94a3b8}@media (prefers-color-scheme:dark){:root{--card:#0d1117;--panel:#161b22;--border:#30363d;--ink:#e6edf3;--muted:#9aa4b2;--neuf:#1c2330;--neus:#3d444d;--arw:#6e7681}}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="418" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 1 — CBC Bit-Flipping Malleability</tspan></text><rect x="40" y="62" width="820" height="40" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="450.0" y="86.33333333333333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Target profile: comment1=preview;userdata_input= :role&lt;admin ;comment2=user</tspan></text><rect class="panel" x="40" y="120" width="820" height="260" rx="10" stroke-width="1.5"/><text x="60" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">1. Normal Token Issued by Server</tspan></text><text x="60" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="muted" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Ciphertext Block 1 (preceding block):</tspan></text><rect class="neu" x="60" y="195" width="360" height="36" rx="9" stroke-width="1.5"/><text x="240.0" y="217.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">C[1] (bytes 16..31)</tspan></text><rect class="neu" x="440" y="195" width="360" height="36" rx="9" stroke-width="1.5"/><text x="620.0" y="217.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="620.0" dy="0">C[2] (bytes 32..47)</tspan></text><text x="60" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700"><tspan x="60" dy="0">2. Attacker modifies C[1] byte 0 (XOR ':') and byte 5 (XOR '&lt;'):</tspan></text><rect x="60" y="280" width="360" height="36" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="240.0" y="302.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">C'[1] = C[1] ⊕ Δ (tampered)</tspan></text><rect class="neu" x="440" y="280" width="360" height="36" rx="9" stroke-width="1.5"/><text x="620.0" y="302.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="620.0" dy="0">C[2] (unchanged)</tspan></text><line x1="240" y1="316" x2="240" y2="345" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="620" y1="316" x2="620" y2="345" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="60" y="345" width="360" height="36" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="240.0" y="367.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">P'[1] = Scrambled garbage</tspan></text><rect x="440" y="345" width="360" height="36" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="620.0" y="367.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0">P'[2] = ';role=admin;' (FORGED ROLE!)</tspan></text><text x="450.0" y="405" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: demonstrated on local ProfileCookieService; no knowledge of secret key required.</tspan></text></svg>