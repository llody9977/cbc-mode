<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7894a2}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="418" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 1 — CBC Bit-Flipping Malleability</tspan></text><rect x="40" y="62" width="820" height="40" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="450.0" y="86.33333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Target profile: comment1=preview;userdata_input=[:role&lt;admin];comment2=standard_user;role=user</tspan></text><rect class="panel" x="40" y="120" width="820" height="260" rx="10" stroke-width="1.5"/><text x="60" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">1. Normal Token Issued by Server</tspan></text><text x="60" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Ciphertext Block 1 (preceding block):</tspan></text><rect class="neu" x="60" y="195" width="360" height="36" rx="9" stroke-width="1.5"/><text x="240.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">C[1] (bytes 16..31)</tspan></text><rect class="neu" x="440" y="195" width="360" height="36" rx="9" stroke-width="1.5"/><text x="620.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="620.0" dy="0">C[2] (bytes 32..47)</tspan></text><text x="60" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b42318" text-anchor="start" font-weight="700"><tspan x="60" dy="0">2. Attacker XORs C[1] bytes 0 and 5 with Δ = 0x01 (':'⊕';' and '&lt;'⊕'='):</tspan></text><rect x="60" y="280" width="360" height="36" rx="9" fill="#fff1f0" stroke="#b42318" stroke-width="1.5"/><text x="240.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b42318" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">C'[1] = C[1] ⊕ Δ (tampered)</tspan></text><rect class="neu" x="440" y="280" width="360" height="36" rx="9" stroke-width="1.5"/><text x="620.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="620.0" dy="0">C[2] (unchanged)</tspan></text><line x1="240" y1="316" x2="240" y2="345" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="620" y1="316" x2="620" y2="345" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect class="neu" x="60" y="345" width="360" height="36" rx="9" stroke-width="1.5"/><text x="240.0" y="367.0" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">P'[1] = Scrambled garbage</tspan></text><rect x="440" y="345" width="360" height="36" rx="9" fill="#fff1f0" stroke="#b42318" stroke-width="1.5"/><text x="620.0" y="367.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b42318" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0">P'[2] starts ';role=admin;' — FORGED ROLE</tspan></text><text x="450.0" y="405" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: demonstrated on local ProfileCookieService; no knowledge of secret key required.</tspan></text></svg>
