<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7894a2}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="382" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 4 — CBC Padding Oracle Ciphertext Forgery (CBC-R)</tspan></text><rect x="40" y="62" width="820" height="40" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="450.0" y="86.33333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">CBC-R Forgery: valid ciphertext for a chosen plaintext, from a padding oracle alone (no key)</tspan></text><rect class="panel" x="40" y="116" width="820" height="230" rx="10" stroke-width="1.5"/><text x="60" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Backwards Ciphertext Block Synthesis:</tspan></text><rect class="neu" x="60" y="160" width="240" height="44" rx="9" stroke-width="1.5"/><text x="180.0" y="178.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="180.0" dy="0">1. Pick Random C[n]</tspan><tspan x="180.0" dy="15">Last ciphertext block</tspan></text><line x1="300" y1="182" x2="340" y2="182" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="340" y="160" width="240" height="44" rx="9" fill="#f2edff" stroke="#6d28d9" stroke-width="1.5"/><text x="460.0" y="178.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600"><tspan x="460.0" dy="0">2. Oracle recovers I[n]</tspan><tspan x="460.0" dy="15">I[n] = D_K(C[n])</tspan></text><line x1="580" y1="182" x2="620" y2="182" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="620" y="160" width="220" height="44" rx="9" fill="#fff6df" stroke="#9a5b00" stroke-width="1.5"/><text x="730.0" y="178.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a5b00" text-anchor="middle" font-weight="600"><tspan x="730.0" dy="0">3. Compute C[n-1]</tspan><tspan x="730.0" dy="15">C[n-1] = I[n] ⊕ P[n]</tspan></text><line x1="730" y1="204" x2="730" y2="230" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="60" y="230" width="780" height="62" rx="9" fill="#fff1f0" stroke="#b42318" stroke-width="1.5"/><text x="450.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b42318" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">4. Repeat backwards for C[n-2]... down to IV = I[1] ⊕ P[1]</tspan><tspan x="450.0" dy="15">Result: (IV, C[1], ..., C[n]) decrypts to the chosen plaintext, valid PKCS#7</tspan><tspan x="450.0" dy="15">REQUIRES the endpoint to accept an attacker-supplied IV, else block 1 is garbage</tspan></text><text x="450.0" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: demonstrated using local makePaddingOracle and forgeCiphertextWithOracle.</tspan></text></svg>
