<svg xmlns="http://www.w3.org/2000/svg" width="900" height="376" viewBox="0 0 900 376" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7894a2}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="374" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 2 — Vaudenay Padding Oracle Plaintext Recovery</tspan></text><rect x="40" y="62" width="820" height="40" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="450.0" y="86.33333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Padding Oracle: returns True if decrypted plaintext has valid PKCS#7 padding</tspan></text><rect class="panel" x="40" y="116" width="820" height="220" rx="10" stroke-width="1.5"/><text x="60" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Iterative byte recovery from byte 15 down to 0:</tspan></text><rect class="neu" x="60" y="160" width="360" height="40" rx="9" stroke-width="1.5"/><text x="240.0" y="176.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">Craft probe block C' with candidate byte at position 15</tspan><tspan x="240.0" dy="15">Target padding: 0x01</tspan></text><line x1="420" y1="180" x2="470" y2="180" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="470" y="160" width="370" height="56" rx="9" fill="#f2edff" stroke="#6d28d9" stroke-width="1.5"/><text x="655.0" y="176.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600"><tspan x="655.0" dy="0">Oracle returns True for ANY valid PKCS#7 ending</tspan><tspan x="655.0" dy="15">One candidate gives 0x01 → I[15] = C'[15] ⊕ 0x01</tspan><tspan x="655.0" dy="15">(recheck byte 14 to reject 0x02 0x02 …)</tspan></text><line x1="655" y1="216" x2="655" y2="238" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="470" y="238" width="370" height="40" rx="9" fill="#f2edff" stroke="#6d28d9" stroke-width="1.5"/><text x="655.0" y="254.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600"><tspan x="655.0" dy="0">Set C'[15] = I[15] ⊕ 0x02, test C'[14] for padding 0x02</tspan><tspan x="655.0" dy="15">Reveals intermediate byte I[14] = C'[14] ⊕ 0x02</tspan></text><line x1="470" y1="258" x2="420" y2="258" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="60" y="238" width="360" height="40" rx="9" fill="#fff1f0" stroke="#b42318" stroke-width="1.5"/><text x="240.0" y="254.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b42318" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0">Compute Plaintext: P[i] = I ⊕ C[i-1]</tspan><tspan x="240.0" dy="15">Queries: ≈ 256 × L worst case (avg ≈ 128 × L)</tspan></text><text x="450.0" y="360" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: demonstrated against local mock oracle (makePaddingOracle); key never exposed.</tspan></text></svg>
