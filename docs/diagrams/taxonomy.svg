<svg xmlns="http://www.w3.org/2000/svg" width="900" height="378" viewBox="0 0 900 378" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7894a2}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="376" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">CBC mode's three failure conditions and four attack vectors</tspan></text><text x="450.0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">conditions that make unauthenticated CBC attacks practical</tspan></text><rect x="370.0" y="62" width="160" height="44" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="450.0" y="89.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">AES-CBC</tspan></text><rect x="40" y="145" width="250" height="68" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="165.0" y="167.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="165.0" dy="0">Condition 1 — No integrity</tspan><tspan x="165.0" dy="15">Ciphertext is malleable; modifying C[i-1]</tspan><tspan x="165.0" dy="15">mutates P[i] deterministically</tspan></text><rect x="325" y="145" width="250" height="68" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="450.0" y="167.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Condition 2 — Padding feedback</tspan><tspan x="450.0" dy="15">Unauthenticated decryption leaks 1-bit</tspan><tspan x="450.0" dy="15">PKCS#7 padding validation status</tspan></text><rect x="610" y="145" width="250" height="68" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="735.0" y="167.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="735.0" dy="0">Condition 3 — Predictable IV</tspan><tspan x="735.0" dy="15">Using chained/predictable IVs breaks</tspan><tspan x="735.0" dy="15">IND-CPA indistinguishability</tspan></text><line x1="430.0" y1="106" x2="165.0" y2="143" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="106" x2="450.0" y2="143" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="470.0" y1="106" x2="735.0" y2="143" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect class="neu" x="30" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="30" y="264" width="6" height="68" rx="3" fill="#b42318"/><text x="127.5" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0">Vector 1</tspan></text><text x="127.5" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="127.5" dy="0">Bit-flipping malleability</tspan></text><text x="127.5" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="127.5" dy="0">active mutation</tspan></text><rect class="neu" x="245" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="245" y="264" width="6" height="68" rx="3" fill="#b42318"/><text x="342.5" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="342.5" dy="0">Vector 2</tspan></text><text x="342.5" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="342.5" dy="0">Padding oracle decryption</tspan></text><text x="342.5" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="342.5" dy="0">active oracle (Vaudenay)</tspan></text><rect class="neu" x="460" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="460" y="264" width="6" height="68" rx="3" fill="#9a5b00"/><text x="557.5" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="557.5" dy="0">Vector 3</tspan></text><text x="557.5" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="557.5" dy="0">Predictable IV attack</tspan></text><text x="557.5" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="557.5" dy="0">chosen plaintext (BEAST)</tspan></text><rect class="neu" x="675" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="675" y="264" width="6" height="68" rx="3" fill="#6d28d9"/><text x="772.5" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0">Vector 4</tspan></text><text x="772.5" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="772.5" dy="0">Padding oracle forgery</tspan></text><text x="772.5" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="772.5" dy="0">active synthesis (CBC-R)</tspan></text><line x1="165.0" y1="213" x2="127.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="213" x2="342.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="735.0" y1="213" x2="557.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="213" x2="772.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><text x="450.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational analysis of CBC mode vulnerabilities; all attacks demonstrated against self-contained local oracles.</tspan></text></svg>
