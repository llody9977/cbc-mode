<svg xmlns="http://www.w3.org/2000/svg" width="900" height="378" viewBox="0 0 900 378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>:root{--card:#ffffff;--panel:#f8fafc;--border:#e2e8f0;--ink:#0f172a;--muted:#475569;--neuf:#f1f5f9;--neus:#cbd5e1;--arw:#94a3b8}@media (prefers-color-scheme:dark){:root{--card:#0d1117;--panel:#161b22;--border:#30363d;--ink:#e6edf3;--muted:#9aa4b2;--neuf:#1c2330;--neus:#3d444d;--arw:#6e7681}}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="376" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">CBC mode's three root causes and four attack vectors</tspan></text><text x="450.0" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">structural flaws in unauthenticated CBC mode and their attack manifestations</tspan></text><rect x="370.0" y="62" width="160" height="44" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="450.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">AES-CBC</tspan></text><rect x="40" y="145" width="250" height="68" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="165.0" y="167.83333333333334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="165.0" dy="0">Root cause 1 — No integrity</tspan><tspan x="165.0" dy="15">Ciphertext is malleable; modifying C[i-1]</tspan><tspan x="165.0" dy="15">mutates P[i] deterministically</tspan></text><rect x="325" y="145" width="250" height="68" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="450.0" y="167.83333333333334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Root cause 2 — Padding oracle</tspan><tspan x="450.0" dy="15">Unauthenticated decryption leaks 1-bit</tspan><tspan x="450.0" dy="15">PKCS#7 padding validation status</tspan></text><rect x="610" y="145" width="250" height="68" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="735.0" y="167.83333333333334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="735.0" dy="0">Root cause 3 — Predictable IV</tspan><tspan x="735.0" dy="15">Using chained/predictable IVs breaks</tspan><tspan x="735.0" dy="15">IND-CPA indistinguishability</tspan></text><line x1="430.0" y1="106" x2="165.0" y2="143" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="106" x2="450.0" y2="143" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="470.0" y1="106" x2="735.0" y2="143" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect class="neu" x="30" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="30" y="264" width="6" height="68" rx="3" fill="#dc2626"/><text x="127.5" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0">Vector 1</tspan></text><text x="127.5" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="127.5" dy="0">Bit-flipping malleability</tspan></text><text x="127.5" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="127.5" dy="0">active mutation</tspan></text><rect class="neu" x="245" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="245" y="264" width="6" height="68" rx="3" fill="#dc2626"/><text x="342.5" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="342.5" dy="0">Vector 2</tspan></text><text x="342.5" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="342.5" dy="0">Padding oracle decryption</tspan></text><text x="342.5" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="342.5" dy="0">active oracle (Vaudenay)</tspan></text><rect class="neu" x="460" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="460" y="264" width="6" height="68" rx="3" fill="#b45309"/><text x="557.5" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="557.5" dy="0">Vector 3</tspan></text><text x="557.5" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="557.5" dy="0">Predictable IV attack</tspan></text><text x="557.5" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="557.5" dy="0">chosen plaintext (BEAST)</tspan></text><rect class="neu" x="675" y="264" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="675" y="264" width="6" height="68" rx="3" fill="#6d28d9"/><text x="772.5" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0">Vector 4</tspan></text><text x="772.5" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="772.5" dy="0">Padding oracle forgery</tspan></text><text x="772.5" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="772.5" dy="0">active synthesis (CBC-R)</tspan></text><line x1="165.0" y1="213" x2="127.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="213" x2="342.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="735.0" y1="213" x2="557.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="213" x2="772.5" y2="262" class="arw" stroke-width="2" marker-end="url(#arw)"/><text x="450.0" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational analysis of CBC mode vulnerabilities; all attacks demonstrated against self-contained local oracles.</tspan></text></svg>
