<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>:root{--card:#ffffff;--panel:#f8fafc;--border:#e2e8f0;--ink:#0f172a;--muted:#475569;--neuf:#f1f5f9;--neus:#cbd5e1;--arw:#94a3b8}@media (prefers-color-scheme:dark){:root{--card:#0d1117;--panel:#161b22;--border:#30363d;--ink:#e6edf3;--muted:#9aa4b2;--neuf:#1c2330;--neus:#3d444d;--arw:#6e7681}}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="382" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 3 — Predictable IV Chosen-Plaintext Attack (BEAST)</tspan></text><rect x="40" y="62" width="820" height="40" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="450.0" y="86.33333333333333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">TLS 1.0 Chained IV Vulnerability: Record N+1 uses Record N's last ciphertext block as IV</tspan></text><rect class="panel" x="40" y="116" width="820" height="230" rx="10" stroke-width="1.5"/><text x="60" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Chosen-Plaintext Guess Alignment (BEAST):</tspan></text><rect class="neu" x="60" y="160" width="370" height="44" rx="9" stroke-width="1.5"/><text x="245.0" y="178.33333333333334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="245.0" dy="0">1. Target Request (Record N):</tspan><tspan x="245.0" dy="15">Capture C_target = E_K(IV_target ⊕ (Pad ‖ Secret))</tspan></text><rect x="470" y="160" width="370" height="44" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="655.0" y="178.33333333333334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="600"><tspan x="655.0" dy="0">2. Predictable Next IV:</tspan><tspan x="655.0" dy="15">Attacker knows IV_next = C_last</tspan></text><line x1="245" y1="204" x2="245" y2="230" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="655" y1="204" x2="655" y2="230" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="60" y="230" width="780" height="50" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="450.0" y="244.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">3. Probe Request (Record N+1): Attacker submits P_guess = IV_next ⊕ IV_target ⊕ (Pad ‖ Candidate)</tspan><tspan x="450.0" dy="15">Cipher computes: E_K(P_guess ⊕ IV_next) = E_K(IV_target ⊕ (Pad ‖ Candidate))</tspan><tspan x="450.0" dy="15">When C_probe == C_target → Candidate is the exact secret byte!</tspan></text><text x="450.0" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational simulation of CVE-2011-3389 against local ChainedIvSession.</tspan></text></svg>
