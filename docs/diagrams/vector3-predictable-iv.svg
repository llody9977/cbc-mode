<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7894a2}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="382" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 3 — Predictable IV Chosen-Plaintext Attack (BEAST)</tspan></text><rect x="40" y="62" width="820" height="40" rx="9" fill="#006da0" stroke="#006da0" stroke-width="1.5"/><text x="450.0" y="86.33333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">TLS 1.0 Chained IV Vulnerability: Record N+1 uses Record N's last ciphertext block as IV</tspan></text><rect class="panel" x="40" y="116" width="820" height="230" rx="10" stroke-width="1.5"/><text x="60" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Chosen-Plaintext Guess Alignment (BEAST):</tspan></text><rect class="neu" x="60" y="160" width="370" height="44" rx="9" stroke-width="1.5"/><text x="245.0" y="178.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="245.0" dy="0">1. Target Request (Record N):</tspan><tspan x="245.0" dy="15">Capture C_target = E_K(IV_target ⊕ (Pad ‖ Secret))</tspan></text><rect x="470" y="160" width="370" height="44" rx="9" fill="#fff6df" stroke="#9a5b00" stroke-width="1.5"/><text x="655.0" y="178.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a5b00" text-anchor="middle" font-weight="600"><tspan x="655.0" dy="0">2. Predictable Next IV:</tspan><tspan x="655.0" dy="15">Attacker knows IV_next = C_last</tspan></text><line x1="245" y1="204" x2="245" y2="230" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="655" y1="204" x2="655" y2="230" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect x="60" y="230" width="780" height="50" rx="9" fill="#fff1f0" stroke="#b42318" stroke-width="1.5"/><text x="450.0" y="244.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b42318" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">3. Probe Request (Record N+1): Attacker submits P_guess = IV_next ⊕ IV_target ⊕ (Pad ‖ Candidate)</tspan><tspan x="450.0" dy="15">Cipher computes: E_K(P_guess ⊕ IV_next) = E_K(IV_target ⊕ (Pad ‖ Candidate))</tspan><tspan x="450.0" dy="15">When C_probe == C_target → Candidate is the exact secret byte!</tspan></text><text x="450.0" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational simulation of CVE-2011-3389 against local ChainedIvSession.</tspan></text></svg>
