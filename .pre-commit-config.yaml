# Local git hooks — the earliest secret gate, before a commit is ever created.
# One-time setup (per clone):
#   pipx install pre-commit            # or: pip install pre-commit / brew install pre-commit
#   pre-commit install                 # scan on every commit
#   pre-commit install --hook-type pre-push   # also scan on push
# Keep the pinned revs current with:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks            # blocks a commit/push containing a secret
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
