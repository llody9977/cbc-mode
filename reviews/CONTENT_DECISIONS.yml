# Durable content-decision register for cbc-mode.
# Re-created fresh on 2026-08-24 after the previous register was intentionally cleared.
# Each record is a settled content position, reaffirmed against current primary sources
# during the 2026-08-24 fresh review (claude-opus-5 / high). History of earlier records
# lives in git, not here. See CONTENT_DECISION_GUIDE.md for the lifecycle rules.
schema_version: 1
decisions:
  - id: CD-0001
    title: Structure the analysis as three root causes mapped to four attack vectors, each paired with AEAD remediation
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/index.html
        - docs/js/attacks.mjs
        - docs/diagrams/taxonomy.svg
      concepts:
        - CBC attack taxonomy
        - root causes
        - bit-flipping malleability
        - padding oracle decryption
        - predictable IV BEAST
        - CBC-R forgery
        - AEAD defense
    originating_feedback: >-
      The repository's purpose is a non-theoretical explanation of why unauthenticated
      AES-CBC is unsafe, with each weakness shown live and paired with its fix.
    decision: >-
      Organize the document and demos around three root causes — (1) no ciphertext
      integrity / malleability, (2) unauthenticated decryption exposing a padding oracle,
      (3) predictable / chained IVs — mapped to four attack vectors: Vector 1 bit-flipping,
      Vector 2 Vaudenay padding-oracle decryption, Vector 3 BEAST predictable-IV break, and
      Vector 4 CBC-R forgery. Pair every weakness with authenticated-encryption remediation
      (AES-GCM / ChaCha20-Poly1305) and a residual-risk note on nonce management.
    rationale: >-
      The root-cause → vector mapping keeps the taxonomy honest: Vector 4 rests on both the
      padding oracle (root cause 2) and malleability (root cause 1), which the taxonomy edges
      and Vector 4 prose both state. Pairing each attack with its fix satisfies the
      never-ship-an-attack-without-the-fix rule.
    authoritative_sources:
      - title: NIST SP 800-38A (CBC mode definition)
        url: https://csrc.nist.gov/pubs/sp/800/38/a/final
        supports: CBC encryption/decryption relations and the IV-unpredictability requirement
      - title: RFC 8446 (TLS 1.3)
        url: https://datatracker.ietf.org/doc/html/rfc8446
        supports: CBC removed from TLS 1.3 in favor of mandatory AEAD
    verification_methods:
      - The taxonomy.svg renders the three-root-cause / four-vector mapping and matches its generator byte-for-byte
      - The Node test suite exercises all four vectors plus the AES-GCM defense against real Web Crypto AES
    approved_outcome: >-
      index.html presents the taxonomy and four vectors; attacks.mjs implements all four plus
      the GCM defense; taxonomy.svg depicts the mapping.
    invalidation_conditions:
      - A governing standard reclassifies one of the vectors or root causes
      - A vector is added or removed, changing the taxonomy
    related_decisions: [CD-0002, CD-0003, CD-0004, CD-0005]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0002
    title: State the attacker-supplied-IV prerequisite wherever CBC-R forgery is claimed
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/index.html
        - docs/js/ui.mjs
        - docs/diagrams/vector4-cbc-r-forgery.svg
      concepts:
        - CBC-R forgery
        - attacker-supplied IV
        - first block garbled
    originating_feedback: >-
      CBC-R computes an IV rather than accepting one, so "every block lands as chosen" is
      only true where the endpoint reads the IV from attacker-supplied data.
    decision: >-
      Everywhere the page claims arbitrary forgery, state the prerequisite that the endpoint
      must accept an attacker-supplied IV; otherwise the technique works from block 2 onward
      but the first block decrypts to garbage. Say the demo shows the favorable case because
      it supplies its own IV.
    rationale: >-
      Rizzo & Duong state the limitation plainly and say they found no generic way to overcome
      it; omitting it would overclaim the attack's reach.
    authoritative_sources:
      - title: Rizzo & Duong, Practical Padding Oracle Attacks (USENIX WOOT 2010)
        url: https://www.usenix.org/legacy/event/woot10/tech/full_papers/Rizzo.pdf
        supports: Names CBC-R and states the IV-control limitation and its situational workarounds
    verification_methods:
      - >-
        Fetched the WOOT 2010 PDF this review and confirmed verbatim quotes: "We call it CBC-R
        encryption" and "we have not found generic way to overcome it", plus the captured-prefix
        and brute-force-C0 workarounds
      - The Vector 4 callout, the vector4 diagram, and the ui.mjs verdict all carry the IV prerequisite
    approved_outcome: >-
      index.html Vector 4 callout, the forgery verdict in ui.mjs, and vector4-cbc-r-forgery.svg
      each state the attacker-supplied-IV condition and the garbled-first-block consequence.
    invalidation_conditions:
      - New primary evidence shows a generic way to control the first block without an attacker IV
      - The demo changes to model a fixed-IV endpoint
    related_decisions: [CD-0001, CD-0003]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0003
    title: Describe the padding oracle as answering block-wide PKCS#7 validity, with a disambiguation recheck
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/index.html
        - docs/js/attacks.mjs
        - docs/diagrams/vector2-padding-oracle.svg
      concepts:
        - padding oracle
        - PKCS#7 validity
        - false positive recheck
        - query count
    originating_feedback: >-
      A padding oracle reports whether the whole block carries valid PKCS#7, not merely
      whether the last byte is 0x01, so a second candidate can validate (e.g. a trailing
      0x02 0x02).
    decision: >-
      State that the oracle answers block-wide validity and that a genuine 0x01 must be
      disambiguated by perturbing the second-to-last byte and re-querying. Explain that this
      recheck is why the implementation's query count can slightly exceed 256 x L.
    rationale: >-
      Without the recheck, recovery can lock onto a false-positive candidate; the code and
      the stated query bound must agree with the mechanism described.
    authoritative_sources:
      - title: Vaudenay, Security Flaws Induced by CBC Padding (EUROCRYPT 2002)
        url: https://link.springer.com/chapter/10.1007/3-540-46035-7_35
        supports: Padding-oracle plaintext recovery via PKCS#7 validity feedback
    verification_methods:
      - recoverIntermediateBlock in attacks.mjs performs the padVal==1 recheck by mutating the previous byte
      - >-
        The Vector 2 test asserts queryCount <= 256*ciphertext.length + 2*blocks, accounting
        for the recheck, and the prose/diagram both cite "~256 x L worst case (avg ~128 x L)"
    approved_outcome: >-
      index.html Vector 2 callout, vector2-padding-oracle.svg, and the attacks.mjs recovery
      routine all describe block-wide validity and the recheck.
    invalidation_conditions:
      - The recovery algorithm changes its candidate-disambiguation strategy
      - A cited query-count figure is revised
    related_decisions: [CD-0001, CD-0002]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0004
    title: Record both NIST SP 800-38D IV-construction ceilings rather than calling 96-bit deterministic IVs unlimited
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/index.html
      concepts:
        - AES-GCM nonce uniqueness
        - deterministic IV ceiling
        - RBG-based IV global cap
        - residual risk
    originating_feedback: >-
      96-bit deterministic IVs are exempt from the 2^32 global invocation cap, but not from
      every cap; the field lengths still bound invocations.
    decision: >-
      In the residual-risk section, record the 2^-32 IV-reuse bound (§8), and both §8.2/§8.3
      ceilings: the deterministic 96-bit construction is limited to 2^s invocations for an
      s-bit invocation field (2^64 under NIST's suggested 32/64 split), while the RBG-based
      construction is bound by the 2^32 global cap.
    rationale: >-
      Calling 96-bit deterministic IVs "unlimited" would be a material numeric overclaim; both
      ceilings are uniqueness budgets that require rekeying before exhaustion.
    authoritative_sources:
      - title: NIST SP 800-38D (GCM)
        url: https://csrc.nist.gov/pubs/sp/800/38/d/final
        supports: §8 2^-32 reuse bound; §8.2 IV constructions; §8.3 invocation ceilings including "any supported IV length, including 96 bits"
    verification_methods:
      - >-
        Fetched SP 800-38D this review and confirmed §8 ("shall be no greater than 2-32"),
        §8.2.1 (suggested 32-bit fixed / 64-bit invocation split), and §8.3 ("cannot be
        invoked on more than 2^s distinct input sets"; 2^32 global cap for the RBG-based path)
    approved_outcome: >-
      index.html "Residual risk after switching to AES-GCM" states the 2^-32 bound and both
      construction ceilings with correct section attributions.
    invalidation_conditions:
      - NIST revises SP 800-38D's IV constructions or invocation limits
      - The residual-risk section is rescoped
    related_decisions: [CD-0001]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0005
    title: "Diagram color convention: green never marks a successful attack"
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/diagrams/generate_diagrams.py
        - docs/diagrams/taxonomy.svg
        - docs/diagrams/modes-cbc-vs-gcm.svg
      concepts:
        - diagram color convention
        - semantic colors
        - dual-use defensibility
    originating_feedback: >-
      A weakness figure detaches from its page, so its colors must not imply that an attack
      succeeding is a safe/good outcome.
    decision: >-
      Apply one fixed convention across every diagram: red = attacker-controlled input or a
      successful attack outcome, green = a defense holding, purple = oracle interaction,
      amber = a leaked/predictable value, navy = neutral cipher operation. Green never labels
      a successful attack.
    rationale: >-
      Consistent semantic color keeps each figure independently readable as defensive
      education when detached from surrounding prose.
    authoritative_sources: []
    verification_methods:
      - The generator's module docstring states the convention and the fixed semantic palette
      - >-
        Rendered taxonomy.svg and modes-cbc-vs-gcm.svg in both light and dark themes this
        review: attack outcomes are red, the AES-GCM defense path is green, no green marks an attack
    approved_outcome: >-
      generate_diagrams.py encodes the convention; all six SVGs follow it.
    invalidation_conditions:
      - The palette or its semantic assignments change
      - A new diagram introduces a color meaning not in the convention
    related_decisions: [CD-0001]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0006
    title: Cover Encrypt-then-MAC versus MAC-then-Encrypt as the retrofit path when CBC cannot be replaced
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/index.html
      concepts:
        - Encrypt-then-MAC
        - MAC-then-Encrypt
        - Lucky Thirteen
        - constant-time verification
    originating_feedback: >-
      Where a constraint forces CBC to remain, "add an HMAC" is not by itself sufficient; the
      composition order decides whether the padding oracle survives.
    decision: >-
      Explain EtM (verify tag before decrypt — no padding status to leak) as the correct
      retrofit, contrast MtE (the ordering Lucky Thirteen measured) and E&M, and require
      constant-time verification with a single generic error. State that AEAD remains the
      recommendation where the choice is free.
    rationale: >-
      Composition order is the load-bearing detail; omitting it would let a reader "fix" CBC
      in a way that preserves the oracle.
    authoritative_sources:
      - title: RFC 7366 (Encrypt-then-MAC for TLS)
        url: https://datatracker.ietf.org/doc/html/rfc7366
        supports: Negotiates EtM for TLS CBC ciphersuites
      - title: AlFardan & Paterson, Lucky Thirteen
        url: https://www.isg.rhul.ac.uk/tls/Lucky13.html
        supports: Timing attack against MAC-then-Encrypt CBC in TLS
    verification_methods:
      - index.html "If CBC must stay" section contrasts EtM / MtE / E&M and links RFC 7366 and Lucky13 (both resolve 200 this review)
    approved_outcome: >-
      index.html covers the three compositions, names the failed ordering, and keeps AEAD as
      the default recommendation.
    invalidation_conditions:
      - A cited RFC or attack result is superseded
      - The retrofit guidance is rescoped
    related_decisions: [CD-0001]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0007
    title: Demo output uses textContent only; innerHTML is not used in the UI layer
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/js/ui.mjs
      concepts:
        - XSS safety
        - textContent
        - untrusted output rendering
    originating_feedback: >-
      Demo inputs flow through real encryption and return as decrypted text, so any rendered
      value can carry attacker-chosen bytes.
    decision: >-
      Render every value through textContent (never innerHTML) so a payload such as
      an <img onerror> string appears as literal characters, mirroring the rule the page
      recommends for untrusted values reaching a DOM sink.
    rationale: >-
      An educational security page must not itself contain a DOM-XSS sink; textContent-only
      output is the demonstrated-safe discipline.
    authoritative_sources: []
    verification_methods:
      - grep confirms zero innerHTML occurrences in ui.mjs; all output flows through el()/textContent helpers
    approved_outcome: >-
      ui.mjs assigns all rendered values via textContent and documents the rule in its header comment.
    invalidation_conditions:
      - Any innerHTML or equivalent HTML-parsing sink is introduced into the UI layer
    related_decisions: [CD-0001]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0008
    title: Scope the thesis to unauthenticated / misused CBC, not "CBC mode is unsafe" categorically
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/index.html
        - README.md
        - DISCLAIMER.md
        - package.json
      concepts:
        - thesis framing
        - confidentiality vs integrity
        - authenticated CBC
        - Encrypt-then-MAC
        - unpredictable IV requirement
        - not authenticated encryption
    originating_feedback: >-
      Review feedback (2026-08-24): the title/H1/lede overclaimed. "CBC is not insecure; it
      does not provide integrity and can still be used with authentication." The blanket
      claim "AES-CBC mode is unsafe" asserts more than the sources support.
    decision: >-
      Reframe the title, H1, lede, the "what to remember" callout, and every repo echo
      (README, DISCLAIMER, package.json) to state precisely: CBC provides confidentiality but
      not integrity, is not authenticated encryption, and requires unpredictable IVs;
      unauthenticated or misused CBC is exploitable without the key; but CBC with
      Encrypt-then-MAC and unpredictable IVs is a sound construction, and AEAD is the modern
      default. Do not assert the mode is categorically broken. Title becomes "Unauthenticated
      AES-CBC is unsafe."
    rationale: >-
      "AES-CBC is unsafe" (X is unsafe) and "CBC does not by itself provide integrity" (X does
      not provide Y) are different claims requiring different evidence; the cited standards
      support the latter, not the former. NIST SP 800-38A defines CBC as a confidentiality
      mode, and RFC 7366 exists precisely because authenticated CBC is a legitimate
      construction — so a categorical "unsafe" is an overclaim.
    authoritative_sources:
      - title: NIST SP 800-38A
        url: https://csrc.nist.gov/pubs/sp/800/38/a/final
        supports: CBC is a confidentiality mode; the IV must be unpredictable — CBC makes no integrity claim
      - title: RFC 7366 (Encrypt-then-MAC for TLS)
        url: https://datatracker.ietf.org/doc/html/rfc7366
        supports: Authenticated CBC (Encrypt-then-MAC) is a standardized, sound construction
    verification_methods:
      - grep confirms no bare "CBC (mode) is unsafe" remains; every occurrence now carries the "unauthenticated" qualifier
      - The hero was rendered showing the scoped thesis and the "the mode itself is not broken" clause
    approved_outcome: >-
      index.html title/H1/lede/what-to-remember reframed; README H1+lede, DISCLAIMER purpose,
      and package.json description aligned to the scoped thesis.
    invalidation_conditions:
      - Cryptographic consensus changes on CBC's security properties
      - The page is rescoped to treat authenticated CBC as its primary subject
    related_decisions: [CD-0001, CD-0006]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: CD-0009
    title: Neutral diagram boxes must be theme-aware, never a hardcoded light fill with theme-variable text
    status: accepted
    implementation_state: implemented
    scope:
      files:
        - docs/diagrams/generate_diagrams.py
        - docs/diagrams/modes-cbc-vs-gcm.svg
        - docs/diagrams/vector1-bit-flipping.svg
      concepts:
        - dark-mode contrast
        - theme-aware fills
        - diagram legibility
        - generator guard
    originating_feedback: >-
      The 2026-08-24 review found the "Ciphertext C[i]" and "Ciphertext C" boxes in
      modes-cbc-vs-gcm.svg rendered near-invisible in dark mode (~1.1:1 contrast): a hardcoded
      #f1f5f9 fill paired with theme-variable ink text (which lightens to near-white in dark
      mode). The same literal on the vector1 "P'[1]" box left a light box in a dark diagram.
    decision: >-
      Neutral boxes pass the NEU_F sentinel so both fill and text track the theme; a
      fixed-literal fill is permitted only with a fixed-literal text color (the semantic
      badges). Enforce it with a generator assertion in box() that rejects any hardcoded hex
      fill paired with INK/MUTED (theme-variable) text.
    rationale: >-
      A hardcoded fill does not switch with the theme but INK/MUTED text does, so the pairing
      is unreadable in one theme. The guard turns a class of fault the eye caught once into a
      loud generation-time failure.
    authoritative_sources: []
    verification_methods:
      - The guard was confirmed to fire on the original fault (running the pre-fix generator) and to pass after the fix
      - Both boxes were rendered in dark mode at ~13:1 contrast (box #1c2330, text #e6edf3)
    approved_outcome: >-
      generate_diagrams.py carries the _rel_luminance helper and the box() assertion; the two
      affected SVGs now use the theme-aware class="neu".
    invalidation_conditions:
      - The theming model or the neutral-box convention changes
      - A new hardcoded light fill with theme-variable text is introduced (the guard will catch it)
    related_decisions: [CD-0005]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"
